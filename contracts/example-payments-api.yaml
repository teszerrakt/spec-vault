openapi: 3.0.3
info:
  title: "[EXAMPLE] Payments API"
  version: "1.0.0"
  description: "Sample payment processing API for demonstration purposes."
servers:
  - url: https://api.example.com/v1
paths:
  /charges:
    get:
      summary: List all charges
      operationId: listCharges
      tags:
        - Charges
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of charges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Charge"
    post:
      summary: Create a new charge
      operationId: createCharge
      tags:
        - Charges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChargeRequest"
      responses:
        "201":
          description: Charge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
        "400":
          description: Invalid request
  /charges/{id}:
    get:
      summary: Get a charge by ID
      operationId: getCharge
      tags:
        - Charges
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Charge details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
        "404":
          description: Charge not found
  /refunds:
    post:
      summary: Create a refund
      operationId: createRefund
      tags:
        - Refunds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
components:
  schemas:
    Charge:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
        created_at:
          type: string
          format: date-time
    CreateChargeRequest:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
        currency:
          type: string
        description:
          type: string
    Refund:
      type: object
      properties:
        id:
          type: string
        charge_id:
          type: string
        amount:
          type: integer
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
    CreateRefundRequest:
      type: object
      required:
        - charge_id
        - amount
      properties:
        charge_id:
          type: string
        amount:
          type: integer
