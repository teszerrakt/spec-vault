openapi: 3.0.3
info:
  title: "[EXAMPLE] Orders API"
  version: 2.0.0
  description: Sample e-commerce orders API for demonstration purposes.
servers:
  - url: https://api.example.com/v1
paths:
  /orders/{id}:
    get:
      summary: Get Order Details
      description: ""
      operationId: get_orders__id
      responses:
        "200":
          description: Successful response
components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - customer_id
        - items
      properties:
        customer_id:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: string
              quantity:
                type: integer
    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
    OrderDetailsResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        price:
          type: string
          format: none
        lastUpdated:
          type: string
          format: date-time
        tags:
          type: string
          format: none
      description: ""
