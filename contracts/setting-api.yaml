openapi: 3.1.0
info:
  title: E-commerce API
  version: 1.0.0
  summary: API for managing products, categories, and orders in an e-commerce platform.
servers:
  - url: https://api.example.com/v1
paths:
  /products:
    get:
      summary: List all products
      description: List all products with filtering and pagination.
      operationId: listProducts
      tags:
        - products
      responses:
        '200':
          description: A list of products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    post:
      summary: Create a new product
      description: Create a new product with specified details.
      operationId: createProduct
      tags:
        - products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input.
        '500':
          description: Internal server error.
  /products/{id}:
    get:
      summary: Get a specific product
      description: Retrieve details of a specific product by ID.
      operationId: getProductById
      tags:
        - products
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the product to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: Product details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found.
        '500':
          description: Internal server error.
    put:
      summary: Update an existing product
      description: Update details of an existing product by ID.
      operationId: updateProduct
      tags:
        - products
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the product to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input.
        '404':
          description: Product not found.
        '500':
          description: Internal server error.
    delete:
      summary: Delete a product
      description: Delete a product by ID.
      operationId: deleteProduct
      tags:
        - products
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the product to delete.
          schema:
            type: string
      responses:
        '204':
          description: Product deleted successfully.
        '404':
          description: Product not found.
        '500':
          description: Internal server error.
  /products/search:
    get:
      summary: Search products
      description: Search products by keyword or category.
      operationId: searchProducts
      tags:
        - products
      responses:
        '200':
          description: A list of products matching the search criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /categories:
    get:
      summary: List all categories
      description: Retrieve a list of all product categories.
      operationId: listCategories
      tags:
        - categories
      responses:
        '200':
          description: A list of categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          description: Internal server error.
    post:
      summary: Create a new category
      description: Create a new product category.
      operationId: createCategory
      tags:
        - categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Invalid input.
        '500':
          description: Internal server error.
  /categories/{id}:
    get:
      summary: Get category details
      description: Retrieve details of a specific category by ID.
      operationId: getCategoryById
      tags:
        - categories
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the category to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: Category details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found.
        '500':
          description: Internal server error.
    put:
      summary: Update a category
      description: Update details of an existing category by ID.
      operationId: updateCategory
      tags:
        - categories
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the category to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Category updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Invalid input.
        '404':
          description: Category not found.
        '500':
          description: Internal server error.
    delete:
      summary: Delete a category
      description: Delete a category by ID.
      operationId: deleteCategory
      tags:
        - categories
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the category to delete.
          schema:
            type: string
      responses:
        '204':
          description: Category deleted successfully.
        '404':
          description: Category not found.
        '500':
          description: Internal server error.
  /categories/{id}/products:
    get:
      summary: List products in a category
      description: Retrieve all products within a specific category.
      operationId: listProductsInCategory
      tags:
        - categories
        - products
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the category.
          schema:
            type: string
      responses:
        '200':
          description: A list of products in the category.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '404':
          description: Category not found.
        '500':
          description: Internal server error.
  /orders:
    post:
      summary: Create a new order
      description: Create a new order with specified items and shipping details.
      operationId: createOrder
      tags:
        - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input.
        '500':
          description: Internal server error.
  /orders/{id}:
    get:
      summary: Get order details
      description: Retrieve details of a specific order by ID.
      operationId: getOrderById
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the order to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found.
        '500':
          description: Internal server error.
  /orders/customer/{customerId}:
    get:
      summary: List orders for a customer
      description: Retrieve all orders placed by a specific customer.
      operationId: listOrdersForCustomer
      tags:
        - orders
      parameters:
        - name: customerId
          in: path
          required: true
          description: ID of the customer.
          schema:
            type: string
      responses:
        '200':
          description: A list of orders for the customer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '404':
          description: Customer not found.
        '500':
          description: Internal server error.
  /orders/{id}/status:
    put:
      summary: Update order status
      description: Update the status of an existing order.
      operationId: updateOrderStatus
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the order to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: "shipped"
      responses:
        '200':
          description: Order status updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid status.
        '404':
          description: Order not found.
        '500':
          description: Internal server error.
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
        description:
          type: string
      required:
        - id
        - name
        - price
        - category
    ProductInput:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
        description:
          type: string
      required:
        - name
        - price
        - category
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
      required:
        - id
        - name
    CategoryInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
      required:
        - name
    Order:
      type: object
      properties:
        id:
          type: string
        items:
          type: array
          items:
            type: string
        shippingAddress:
          type: string
        paymentMethod:
          type: string
        status:
          type: string
      required:
        - id
        - items
        - shippingAddress
        - paymentMethod
    OrderInput:
      type: object
      properties:
        items:
          type: array
          items:
            type: string
        shippingAddress:
          type: string
        paymentMethod:
          type: string
      required:
        - items
        - shippingAddress
        - paymentMethod